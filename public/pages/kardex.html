<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kárdex de Asistencia - Portal RH</title>
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>

    <div class="dashboard-layout">

        <div class="menu-overlay" id="menu-overlay"></div>

        <!-- El Sidebar se inyecta dinámicamente aquí -->
        <div id="sidebar-container"></div>

        <!-- ================= CONTENIDO PRINCIPAL ================= -->
        <main class="main-content">

            <!-- Top Navbar fija -->
            <div id="navbar-container"></div>

            <!-- Encabezado de la página -->
            <header class="page-header">
                <h1 class="title-primary" style="font-size: 1.8rem; margin-bottom: 0.3rem;">Kárdex de Asistencia</h1>
                <p class="subtitle" style="margin-bottom: 1.5rem;">Portal de Autoservicio Kiosco • Gestiona tus solicitudes e información laboral de forma ágil y segura.</p>
            </header>

            <!-- Calendario Kárdex -->
            <section class="calendar-section">
                <h2 style="font-size: 1.3rem; color: var(--primary-dark); font-weight: 700; margin-bottom: 1.5rem;">Calendario de asistencia</h2>

                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <div class="calendar-month-title" id="cal-month-title">Septiembre 2026</div>
                        <div class="calendar-nav-btns">
                            <button class="btn-cal-arrow" id="cal-prev-month" title="Mes anterior">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
                            <button class="btn-cal-arrow" id="cal-next-month" title="Mes siguiente">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
                        </div>
                    </div>

                    <div class="calendar-weekdays">
                        <div>Lun</div>
                        <div>Mar</div>
                        <div>Mié</div>
                        <div>Jue</div>
                        <div>Vie</div>
                        <div>Sáb</div>
                        <div>Dom</div>
                    </div>

                    <div class="calendar-grid" id="cal-days-container">
                        <!-- Los días se inyectan dinámicamente con JavaScript -->
                    </div>
                </div>

                <!-- Leyenda -->
                <div class="calendar-legend">
                    <div class="legend-item">
                        <span class="legend-dot attended"></span> Asistió
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot missed"></span> No asistió
                    </div>
                </div>

                <!-- Botones de Marcado -->
                <div class="attendance-actions">
                    <button class="btn-clock" id="btn-checkin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Marcar asistencia
          </button>
                    <button class="btn-clock" id="btn-checkout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Marcar hora de salida
          </button>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="/js/controllers/kardex.ctrl.js"></script>
</body>

</html>
